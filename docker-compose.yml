version: "3.9"

# ─── Como usar ────────────────────────────────────────────────────────────────
# 1. Copie .env.example para .env
# 2. Edite .env — defina os caminhos dos dados e as credenciais
# 3. docker compose up --build -d

# ─── Performance (ajuste no .env conforme seu hardware) ──────────────────────
# GDAL_CACHEMAX: ~25% da RAM total  (ex: 32GB RAM → 8192, 64GB → 16384)
# WORKER_CONCURRENCY: número de jobs em paralelo (ex: 4 cores → 2 workers)

x-env-comum: &env-comum
  # Paths internos ao container — não altere
  FABDEM_GEOJSON:      /dados/fabdem/fabdem_v1_2_brasil_celulas_1x1.geojson
  MAPBIOMAS_TIF:       /dados/mapbiomas/${MAPBIOMAS_FILENAME:-mapbiomas_10m_collection2_integration_v1-classification_2023.tif}
  RECLASSIFICACAO_CSV: /config/mapbiomas_atdi.csv
  OUTPUT_DIR:          /saidas
  PROJ_DATA:           /usr/local/lib/python3.11/site-packages/rasterio/proj_data
  # GDAL
  GDAL_CACHEMAX:                    "${GDAL_CACHEMAX:-4096}"
  GDAL_DISABLE_READDIR_ON_OPEN:     "EMPTY_DIR"
  CPL_VSIL_USE_TEMP_FILE_FOR_RANDOM_WRITE: "NO"
  # Celery
  CELERY_BROKER_URL:    redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  # Concorrência
  MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-4}"
  # Segurança — definidos no .env
  HTZ_API_KEY:      "${HTZ_API_KEY:-}"
  CORS_ORIGINS:     "${CORS_ORIGINS:-http://localhost:8080}"
  MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-524288000}"

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"

  api:
    build: .
    expose:
      - "8000"
    volumes:
      # Dados externos — caminhos definidos no .env
      - ${FABDEM_DIR}:/dados/fabdem:ro
      - ${MAPBIOMAS_DIR}:/dados/mapbiomas:ro
      # Locais do projeto — relativos à pasta do docker-compose.yml
      - ./saidas:/saidas
      - ./config:/config:ro
      - ./src:/app/src:ro
      - ./frontend:/app/frontend:ro
    environment:
      <<: *env-comum
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: >
      python -m celery -A src.interface.worker.celery_app worker
      --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-4}
      --pool=prefork
      -Q htz_jobs
    volumes:
      - ${FABDEM_DIR}:/dados/fabdem:ro
      - ${MAPBIOMAS_DIR}:/dados/mapbiomas:ro
      - ./saidas:/saidas
      - ./config:/config:ro
      - ./src:/app/src:ro
    environment:
      <<: *env-comum
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-8G}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/frontend:ro
    depends_on:
      - api
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_BASIC_AUTH: "${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-TROQUE_EM_PRODUCAO}"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
