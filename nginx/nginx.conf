worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Log estruturado JSON ──────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"ip":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"ms":$request_time,'
            '"upstream_ms":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # ── Tamanho máximo de upload (500 MB) ────────────────────────────────────
    client_max_body_size 500m;

    # ── Compressao gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/plain text/css text/html;
    gzip_min_length 1024;
    gzip_comp_level 4;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=job_create:10m  rate=2r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m      rate=1r/s;
    # Tiles locais (SQLite) — alto throughput, sem risco de abuso externo
    limit_req_zone $binary_remote_addr zone=tile_serve:10m  rate=200r/s;
    limit_req_status 429;

    # ── DNS interno Docker — resolve automaticamente após restart de containers ──
    # 127.0.0.11 é o resolvedor DNS interno do Docker Compose
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # Upstream FastAPI — variável força re-resolução pelo DNS a cada request
    # (sem variável o nginx cachearia o IP e falharia após restart do container)
    upstream fastapi {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "DENY"            always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "no-referrer"     always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' data: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;

        # Health check nginx sem log
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Macro de proxy com re-resolução DNS dinâmica ──────────────────────
        # Usar variável força nginx a re-resolver "api" a cada request via DNS
        # do Docker (127.0.0.11), evitando 502 após restart de containers.

        # Upload de TIF com rate limit restrito
        location = /convert {
            limit_req zone=upload burst=3 nodelay;
            set $backend http://api:8000;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
        }

        # Criacao de jobs com rate limit restrito
        location = /jobs {
            limit_req zone=job_create burst=5 nodelay;
            set $backend http://api:8000;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # Download de ZIPs sem buffer (streaming)
        location ~ ^/jobs/[^/]+/download {
            limit_req zone=api_general burst=10 nodelay;
            set $backend http://api:8000;
            proxy_pass            $backend;
            proxy_http_version    1.1;
            proxy_set_header      Connection        "";
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffering       off;
            proxy_read_timeout    300s;
        }

        # Frontend — servido diretamente pelo nginx (sem proxy)
        location = /app {
            return 301 $scheme://$http_host/app/;
        }
        location = /app/ {
            alias   /usr/share/nginx/frontend/;
            index   index.html;
            add_header Cache-Control "no-cache";
        }
        location ^~ /app/ {
            alias   /usr/share/nginx/frontend/;
            add_header Cache-Control "no-cache";
        }

        # Documentação técnica
        location = /docs-site {
            return 301 $scheme://$http_host/docs-site/;
        }
        location ^~ /docs-site/ {
            alias   /usr/share/nginx/docs/;
            index   index.html;
            add_header Cache-Control "no-cache";
        }

        # Tiles de preview — leitura SQLite local, alta concorrência necessária
        location ~ ^/img/preview/[0-9a-f]+/tile/ {
            limit_req zone=tile_serve burst=500 nodelay;
            set $backend http://api:8000;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # API geral — todas as outras rotas
        location / {
            limit_req zone=api_general burst=40 nodelay;
            set $backend http://api:8000;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
